    <!-- Preload (pre-React) styles: Tailwind is bundled inside main.tsx and is NOT available until
         React mounts, so this splash must be fully self-contained inline CSS. -->
    <style>
      .tl-boot {
        position: fixed; inset: 0; z-index: 50;
        display: flex; align-items: center; justify-content: center;
        background:
          radial-gradient(1100px 520px at 50% -12%, #fff6e0 0%, rgba(255,246,224,0) 60%),
          radial-gradient(900px 480px at 50% 115%, #fdf1dc 0%, rgba(253,241,220,0) 55%),
          #fbf8f2;
        font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
        direction: rtl;
        transition: opacity .45s ease;
      }
      .tl-boot.is-hidden { opacity: 0; pointer-events: none; }
      .tl-boot__inner { text-align: center; padding: 24px; animation: tl-rise .55s ease-out both; }
      .tl-boot__logo {
        width: 88px; height: 88px; margin: 0 auto 16px; display: block;
        filter: drop-shadow(0 12px 26px rgba(202,138,4,.30));
        animation: tl-float 2.6s ease-in-out infinite;
      }
      .tl-boot__name { font-size: 27px; font-weight: 800; color: #23272e; letter-spacing: .3px; }
      .tl-boot__tag { margin-top: 6px; font-size: 13px; color: #98a0ab; }
      .tl-boot__bar { position: relative; width: 176px; height: 4px; margin: 24px auto 0; border-radius: 999px; background: #efe6d3; overflow: hidden; }
      .tl-boot__bar::after {
        content: ""; position: absolute; top: 0; bottom: 0; left: -40%; width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, #f6d488, #ca8a04 55%, #f6d488);
        animation: tl-slide 1.3s ease-in-out infinite;
      }
      @keyframes tl-rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @keyframes tl-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes tl-slide { 0% { left: -40%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) {
        .tl-boot__inner, .tl-boot__logo, .tl-boot__bar::after { animation: none; }
      }
    </style>

    <!-- The splash IS the boot loading indicator: it stays until the app reports readiness
         (window.__tlBootReady) so no second spinner flashes after it. A safety timer guarantees
         it never sticks if a signal is missed. -->
    <script>
      window.__tlBootReady = (function () {
        var done = false;
        function fade() {
          if (done) return;
          done = true;
          var el = document.getElementById('app-skeleton');
          if (!el) return;
          el.classList.add('is-hidden');
          el.addEventListener('transitionend', function () { el.remove(); }, { once: true });
          setTimeout(function () { el.remove(); }, 800);
        }
        setTimeout(fade, 3500);
        return fade;
      })();
    </script>
  </head>
  <body class="bg-slate-50 antialiased overflow-x-hidden">
    <!-- Skip to content -->
    <a href="#app-main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:right-2 focus:z-[100] focus:bg-amber-600 focus:text-white focus:px-4 focus:py-2 focus:rounded-xl focus:font-bold focus:text-sm">رفتن به محتوای اصلی</a>

    <div id="root"></div>

    <!-- Preload splash — a fixed overlay OUTSIDE #root so React mounting does not wipe it
         instantly. It doubles as the boot loader: the app calls window.__tlBootReady() once
         real content is ready (see App.tsx / AdminPanel.tsx), which fades it out. Uses only
         inline CSS (see <style> in head) because the Tailwind bundle is not loaded until
         main.tsx runs. -->
    <div id="app-skeleton" class="tl-boot" dir="rtl">
      <div class="tl-boot__inner">
        <img class="tl-boot__logo" src="/talana_logo.png" alt="طلانا" width="88" height="88" />
        <div class="tl-boot__name">طلانا</div>
        <div class="tl-boot__tag">سامانه هوشمند معاملات طلا و نقره</div>
        <div class="tl-boot__bar" role="progressbar" aria-label="در حال بارگذاری"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
